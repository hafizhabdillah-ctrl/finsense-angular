<div class="modal-backdrop" (click)="closed.emit()">
  <section class="settings-modal" (click)="$event.stopPropagation()">
    <header>
      <h2>Pengaturan</h2>
      <button class="close" type="button" (click)="closed.emit()">×</button>
    </header>
    <div class="tabs">
      <button [class.selected]="activeTab === 'user'" (click)="activeTab = 'user'">User</button>
      <button [class.selected]="activeTab === 'umkm'" (click)="activeTab = 'umkm'">UMKM</button>
    </div>
    @if (loading) { <p class="loading">Memuat data...</p> }
    @if (!loading && activeTab === 'user') {
      <form (ngSubmit)="saveUser()">
        <label>Nama Lengkap<input name="full_name" [(ngModel)]="userForm.full_name" required></label>
        <label>Email<input name="email" type="email" [(ngModel)]="userForm.email" required></label>
        @if (error) { <p class="error">{{ error }}</p> }
        <footer>
          <button type="button" class="cancel" (click)="closed.emit()">Batal</button>
          <button class="save" type="submit" [disabled]="saving">{{ saving ? 'Menyimpan...' : 'Simpan Perubahan' }}</button>
        </footer>
      </form>
    }
    @if (!loading && activeTab === 'umkm') {
      <form (ngSubmit)="saveUmkm()">
        <label>Nama Bisnis<input name="business_name" [(ngModel)]="umkmForm.business_name" placeholder="Masukkan nama bisnis"></label>
        <label>Jenis Bisnis<input name="business_type" [(ngModel)]="umkmForm.business_type" placeholder="Contoh: Makanan, Fashion, Elektronik"></label>
        <div class="two-columns">
          <label>Provinsi
            <input name="province" [(ngModel)]="umkmForm.province" placeholder="Provinsi"></label>
            <label>Kota<input name="city" [(ngModel)]="umkmForm.city" placeholder="Kota"></label>
          </div>
          <div class="two-columns">
            <label>Estimasi Pendapatan Bulanan (Rp)<input name="monthly_revenue_est" type="number" [(ngModel)]="umkmForm.monthly_revenue_est" placeholder="0"></label>
            <label>Jumlah Karyawan<input name="employee_count" type="number" [(ngModel)]="umkmForm.employee_count" placeholder="0"></label>
          </div>
          @if (error) { <p class="error">{{ error }}</p> }
          <footer>
            <button type="button" class="cancel" (click)="closed.emit()">Batal</button>
            <button class="save" type="submit" [disabled]="saving">{{ saving ? 'Menyimpan...' : 'Simpan Perubahan' }}</button>
          </footer>
        </form>
    }
  </section>
</div>
